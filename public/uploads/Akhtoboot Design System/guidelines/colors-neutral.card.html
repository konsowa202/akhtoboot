<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ink" subtitle="Cool, faintly-purple greys — 0 → 900" -->
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)}
.card{padding:24px}</style></head>
<body><div class="card"><div style="font-family:var(--font-body)">
  <div style="display:flex;gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--border)"><div style="flex:1;height:64px;background:var(--ink-0);display:flex;align-items:flex-end;padding:6px 8px;color:var(--ink-900);font-family:var(--font-mono);font-size:10px">0</div><div style="flex:1;height:64px;background:var(--ink-50);display:flex;align-items:flex-end;padding:6px 8px;color:var(--ink-900);font-family:var(--font-mono);font-size:10px">50</div><div style="flex:1;height:64px;background:var(--ink-100);display:flex;align-items:flex-end;padding:6px 8px;color:var(--ink-900);font-family:var(--font-mono);font-size:10px">100</div><div style="flex:1;height:64px;background:var(--ink-200);display:flex;align-items:flex-end;padding:6px 8px;color:var(--ink-900);font-family:var(--font-mono);font-size:10px">200</div><div style="flex:1;height:64px;background:var(--ink-300);display:flex;align-items:flex-end;padding:6px 8px;color:var(--ink-900);font-family:var(--font-mono);font-size:10px">300</div><div style="flex:1;height:64px;background:var(--ink-400);display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font-family:var(--font-mono);font-size:10px">400</div><div style="flex:1;height:64px;background:var(--ink-500);display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font-family:var(--font-mono);font-size:10px">500</div><div style="flex:1;height:64px;background:var(--ink-700);display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font-family:var(--font-mono);font-size:10px">700</div><div style="flex:1;height:64px;background:var(--ink-900);display:flex;align-items:flex-end;padding:6px 8px;color:#fff;font-family:var(--font-mono);font-size:10px">900</div></div>
  <div style="margin-top:8px;font-size:12px;color:var(--text-muted)"><b style="color:var(--ink-900)">900 · #1A1426</b> body ink &nbsp;·&nbsp; backgrounds & borders</div>
</div></div></body></html>
