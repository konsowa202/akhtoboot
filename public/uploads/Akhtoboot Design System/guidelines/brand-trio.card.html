<!-- @dsCard group="Brand" viewport="700x170" name="Brand color trio" subtitle="Purple · Teal · Foam" -->
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)}.card{padding:24px}</style></head>
<body><div class="card"><div style="display:flex;gap:14px;font-family:var(--font-body)">
  <div style="flex:1;background:#6B1FB5;color:#fff;border-radius:14px;padding:18px;height:118px;display:flex;flex-direction:column;justify-content:space-between;">
    <span style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;opacity:.8">Primary</span>
    <span><span style="font-family:var(--font-display);font-weight:700;font-size:20px;display:block">Octopus Purple</span><span style="font-family:var(--font-mono);font-size:12px;opacity:.85">#6B1FB5</span></span>
  </div><div style="flex:1;background:#377ea2;color:#fff;border-radius:14px;padding:18px;height:118px;display:flex;flex-direction:column;justify-content:space-between;">
    <span style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;opacity:.8">Secondary</span>
    <span><span style="font-family:var(--font-display);font-weight:700;font-size:20px;display:block">Deep Sea</span><span style="font-family:var(--font-mono);font-size:12px;opacity:.85">#377ea2</span></span>
  </div><div style="flex:1;background:#d5e5f0;color:var(--ink-900);border-radius:14px;padding:18px;height:118px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border)">
    <span style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;opacity:.8">Sub-secondary</span>
    <span><span style="font-family:var(--font-display);font-weight:700;font-size:20px;display:block">Foam</span><span style="font-family:var(--font-mono);font-size:12px;opacity:.85">#d5e5f0</span></span>
  </div>
</div></div></body></html>
