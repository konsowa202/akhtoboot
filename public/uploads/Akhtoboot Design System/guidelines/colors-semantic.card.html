<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Success · warning · danger" -->
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)}
.card{padding:24px}</style></head>
<body><div class="card"><div style="display:flex;gap:12px;font-family:var(--font-body)">
  <div style="flex:1"><div style="height:48px;border-radius:10px;background:var(--success)"></div><div style="height:24px;border-radius:8px;background:var(--success-subtle);margin-top:6px"></div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">Success</div></div><div style="flex:1"><div style="height:48px;border-radius:10px;background:var(--warning)"></div><div style="height:24px;border-radius:8px;background:var(--warning-subtle);margin-top:6px"></div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">Warning</div></div><div style="flex:1"><div style="height:48px;border-radius:10px;background:var(--danger)"></div><div style="height:24px;border-radius:8px;background:var(--danger-subtle);margin-top:6px"></div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">Danger</div></div>
</div></div></body></html>
